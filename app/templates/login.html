{% extends "base.html" %}
{% block content %}
<div class="card login">
  <h1 class="loginbrand"><img src="/static/icons/icon-192.png" width="96" height="96" alt="">BMA <span>Simulator</span><small>powered by yodaeichen</small></h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Benutzername</label><input type="text" id="username" name="username" autofocus required autocomplete="username">
    <label for="password">Passwort</label><input type="password" id="password" name="password" required autocomplete="current-password">
    <div class="actions"><button>Anmelden</button></div>
  </form>
</div>
{% endblock %}
